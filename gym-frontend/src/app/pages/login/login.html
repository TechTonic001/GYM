<main class="auth-page">
	<section class="auth-panel" aria-labelledby="login-title">
		<a class="brand-mark" routerLink="/" aria-label="Gym home">FORM<span>/</span>FIT</a>
		<p class="eyebrow">MEMBER ACCESS</p>
		<h1 id="login-title">Welcome back</h1>
		<p class="intro">Sign in to pick up where your training left off.</p>

		<form (ngSubmit)="onLogin()" #loginForm="ngForm">
			<label for="identifier">Username or email address</label>
			<input
				id="identifier"
				name="identifier"
				type="text"
				autocomplete="username"
				placeholder="Your username or email"
				[(ngModel)]="credentials.identifier"
				required
			/>

			<label for="password">Password</label>
			<div class="password-field">
				<input
					id="password"
					name="password"
					[type]="showPassword ? 'text' : 'password'"
					autocomplete="current-password"
					placeholder="Enter your password"
					[(ngModel)]="credentials.password"
					required
				/>
				<button
					class="password-toggle"
					type="button"
					(click)="showPassword = !showPassword"
					[attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
					[attr.aria-pressed]="showPassword"
				>
					<svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
						<circle cx="12" cy="12" r="3"></circle>
					</svg>
					<svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
						<path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
						<path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.3 0 2.5-.3 3.5-.7"></path>
					</svg>
				</button>
			</div>

			<p *ngIf="errorMessage" class="feedback error" role="alert">{{ errorMessage }}</p>
			<button type="submit" [disabled]="loginForm.invalid">Sign in <span aria-hidden="true">→</span></button>
		</form>

		<p class="switch-page">New to Form/Fit? <a routerLink="/register">Create an account</a></p>
	</section>
</main>

<main class="auth-page">
	<section class="auth-panel" aria-labelledby="register-title">
		<a class="brand-mark" routerLink="/" aria-label="Gym home">FORM<span>/</span>FIT</a>
		<p class="eyebrow">START YOUR NEXT CHAPTER</p>
		<h1 id="register-title">Join the movement</h1>
		<p class="intro">Create your member account and make room for stronger days.</p>

		<form (ngSubmit)="onRegister()" #registerForm="ngForm">
			<label for="full_name">Full name</label>
			<input
				id="full_name"
				name="full_name"
				type="text"
				autocomplete="name"
				placeholder="Your name"
				[(ngModel)]="userData.full_name"
				required
			/>

			<label for="username">Username</label>
			<input
				id="username"
				name="username"
				type="text"
				autocomplete="username"
				placeholder="Choose a username"
				[(ngModel)]="userData.username"
				required
				minlength="3"
				maxlength="30"
				pattern="[-A-Za-z0-9._]+"
			/>
			<p class="field-hint">Use 3–30 letters, numbers, dots, underscores, or hyphens.</p>

			<label for="email">Email address</label>
			<input
				id="email"
				name="email"
				type="email"
				autocomplete="email"
				placeholder="you@example.com"
				[(ngModel)]="userData.email"
				required
				email
			/>

			<label for="password">Password</label>
			<div class="password-field">
				<input
					id="password"
					name="password"
					[type]="showPassword ? 'text' : 'password'"
					autocomplete="new-password"
					placeholder="Choose a password"
					[(ngModel)]="userData.password"
					required
					minlength="8"
				/>
				<button
					class="password-toggle"
					type="button"
					(click)="showPassword = !showPassword"
					[attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
					[attr.aria-pressed]="showPassword"
				>
					<svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true">
						<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
						<circle cx="12" cy="12" r="3"></circle>
					</svg>
					<svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true">
						<path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
						<path d="M9.9 5.2A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a14.8 14.8 0 0 1-3.1 3.9M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.3 0 2.5-.3 3.5-.7"></path>
					</svg>
				</button>
			</div>

			<p *ngIf="errorMessage" class="feedback error" role="alert">{{ errorMessage }}</p>
			<p *ngIf="successMessage" class="feedback success" role="status">{{ successMessage }}</p>
			<button type="submit" [disabled]="registerForm.invalid">Create account <span aria-hidden="true">→</span></button>
		</form>

		<p class="switch-page">Already a member? <a routerLink="/login">Sign in</a></p>
	</section>
</main>
